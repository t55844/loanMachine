[package]
name = "loan_machine"
version = "0.1.0"
description = "Loan Machine — Solana credit cooperative"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "loan_machine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.1", features = ["init-if-needed"] }
anchor-spl  = { version = "1.1.1", features = ["token"] }
