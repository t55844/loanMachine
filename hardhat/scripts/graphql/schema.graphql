# ═══════════════════════════════════════════════════════════════
#  LoanMachine — Subgraph Schema (multi-coop)
#
#  CHANGES vs single-coop:
#  - NEW: Cooperative entity (one per registered LoanMachine)
#  - NEW: CoopRegisteredEvent
#  - All event entities now have `cooperative: Cooperative!`
#  - LoanRequisitionCreatedCancelledEvent ID is namespaced by coop
# ═══════════════════════════════════════════════════════════════

# ── COOPERATIVE (root entity) ─────────────────────────────────

type Cooperative @entity(immutable: false) {
  id: ID!                         # lowercased LoanMachine address
  coopId: Bytes!                  # bytes32 from CoopRegistry
  name: String!
  loanMachine: Bytes!
  registeredAt: BigInt!
  active: Boolean!                # toggled by CoopDeactivated/Reactivated

  # Reverse relations — query "give me everything for this coop"
  members:        [MemberRegisteredEvent!]!                    @derivedFrom(field: "cooperative")
  donations:      [DonatedEvent!]!                         @derivedFrom(field: "cooperative")
  withdrawals:    [WithdrawnEvent!]!                       @derivedFrom(field: "cooperative")
  borrows:        [BorrowedEvent!]!                        @derivedFrom(field: "cooperative")
  repayments:     [RepaidEvent!]!                          @derivedFrom(field: "cooperative")
  loans:          [LoanRequisitionCreatedCancelledEvent!]! @derivedFrom(field: "cooperative")
  reputationLog:  [ReputationChangedEvent!]!               @derivedFrom(field: "cooperative")
  elections:      [ElectionOpenedEvent!]!                  @derivedFrom(field: "cooperative")
  proposals:      [ProposalCreatedEvent!]!                 @derivedFrom(field: "cooperative")
}

type CoopRegisteredEvent @entity(immutable: true) {
  id: ID!
  coopId: Bytes!
  loanMachine: Bytes!
  name: String!
  blockTimestamp: String!
  transactionHash: Bytes!
}

