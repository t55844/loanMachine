# ═══════════════════════════════════════════════════════════════
#  LoanMachine v3 — Subgraph Schema
#
#  CHANGES FROM v1:
#  - memberId: Int → Bytes (bytes32 hashed CPF/CNPJ)
#  - NEW: governance events (Proposal*, Admin*, Threshold*)
#  - NEW: wallet approval co-sign events
#  - NEW: withdrawal delay events
#  - NEW: MemberJoined, CoopDeactivated/Reactivated
#  - REMOVED: NewBorrowerEvent, BorrowLimitReachedEvent, PeriodicCheckRunEvent
#  - All reputation/election events now use Bytes for memberId/candidateId
# ═══════════════════════════════════════════════════════════════

# ── GOVERNANCE: MULTISIG ADMIN ────────────────────────────────

type ProposalCreatedEvent @entity(immutable: true) {
  id: ID!
  proposalId: BigInt!
  pType: Int!            # ProposalType enum as uint8
  proposer: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type ProposalConfirmedEvent @entity(immutable: true) {
  id: ID!
  proposalId: BigInt!
  admin: Bytes!
  confirmations: BigInt!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type ProposalExecutedEvent @entity(immutable: true) {
  id: ID!
  proposalId: BigInt!
  pType: Int!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type AdminAddedEvent @entity(immutable: true) {
  id: ID!
  admin: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type AdminRemovedEvent @entity(immutable: true) {
  id: ID!
  admin: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type AdminTransferredEvent @entity(immutable: true) {
  id: ID!
  oldAdmin: Bytes!
  newAdmin: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type ThresholdChangedEvent @entity(immutable: true) {
  id: ID!
  oldThreshold: BigInt!
  newThreshold: BigInt!
  blockTimestamp: String!
  transactionHash: Bytes!
}

# ── GOVERNANCE: WALLET APPROVAL CO-SIGN ───────────────────────

type ProposalCosignedEvent @entity(immutable: true) {
  id: ID!
  proposalId: BigInt!
  moderatorId: Bytes!         # bytes32 hashed memberId
  blockTimestamp: String!
  transactionHash: Bytes!
}

type WalletApprovedEvent @entity(immutable: true) {
  id: ID!
  wallet: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type WalletRevokedEvent @entity(immutable: true) {
  id: ID!
  wallet: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

# ── MEMBERSHIP ────────────────────────────────────────────────

type MemberJoinedEvent @entity(immutable: true) {
  id: ID!
  wallet: Bytes!
  memberId: Bytes!       # bytes32 hashed CPF/CNPJ
  blockTimestamp: String!
  transactionHash: Bytes!
}

type AccessCodeRotatedEvent @entity(immutable: true) {
  id: ID!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type CoopDeactivatedEvent @entity(immutable: true) {
  id: ID!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type CoopReactivatedEvent @entity(immutable: true) {
  id: ID!
  blockTimestamp: String!
  transactionHash: Bytes!
}

# ── WITHDRAWAL (48h delay) ───────────────────────────────────

type WithdrawalRequestedEvent @entity(immutable: true) {
  id: ID!
  requestId: BigInt!
  requester: Bytes!
  amount: BigInt!
  executableAfter: BigInt!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type WithdrawalExecutedEvent @entity(immutable: true) {
  id: ID!
  requestId: BigInt!
  requester: Bytes!
  amount: BigInt!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type WithdrawalBlockedEvent @entity(immutable: true) {
  id: ID!
  requestId: BigInt!
  blocker: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type WithdrawalCancelledEvent @entity(immutable: true) {
  id: ID!
  requestId: BigInt!
  requester: Bytes!
  blockTimestamp: String!
  transactionHash: Bytes!
}

