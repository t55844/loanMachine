  transactionHash: Bytes!
}

type VoteCastEvent @entity(immutable: true) {
  id: ID!
  electionId: Int!
  candidateId: Bytes!       # bytes32
  memberId: Bytes!          # bytes32
  voteWeight: Int!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type ElectionClosedEvent @entity(immutable: true) {
  id: ID!
  electionId: Int!
  winnerId: Bytes!          # bytes32
