# ── REPUTATION (memberId is now Bytes = bytes32) ─────────────

type MemberToWalletVinculationEvent @entity(immutable: true) {
  id: ID!
  memberId: Bytes!          # bytes32 hashed CPF/CNPJ
  wallet: Bytes!
  walletVinculated: [Bytes!]!
  timestamp: String!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type ReputationChangedEvent @entity(immutable: true) {
  id: ID!
  memberId: Bytes!          # bytes32
  points: Int!
  increase: Boolean!
  newReputation: Int!
  timestamp: String!
  blockTimestamp: String!
  transactionHash: Bytes!
}

type AuthorizedCallerUpdatedEvent @entity(immutable: true) {
  id: ID!
