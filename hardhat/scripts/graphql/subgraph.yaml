specVersion: 0.0.4
description: LoanMachine — multi-cooperative credit indexer
schema:
  file: ./schema.graphql

dataSources:
  # ────────────────────────────────────────────────────────────
  # Fixed: the registry. Spawns one LoanMachine template per coop.
  # ────────────────────────────────────────────────────────────
  - kind: ethereum/contract
    name: CoopRegistry
    network: local
    source:
      address: "0xa966451b622431217FEb5745a16FF60e147f7c4D"
      abi: CoopRegistry
      startBlock: 2
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./mapps/coop-registry.ts
      entities:
        - Cooperative
        - CoopRegisteredEvent
        - MemberRegisteredEvent
      abis:
        - name: CoopRegistry
          file: ./abis/CoopRegistry.json
        - name: LoanMachine
          file: ./abis/LoanMachine.json
      eventHandlers:
        - event: CoopRegistered(indexed bytes32,indexed address,string)
          handler: handleCoopRegistered

templates:
  # ────────────────────────────────────────────────────────────
  # Dynamic: instantiated at runtime, one per LoanMachine address
  # ────────────────────────────────────────────────────────────
  - kind: ethereum/contract
    name: LoanMachine
    network: local
    source:
      abi: LoanMachine
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./mapps/loan-machine.ts
      entities:
        # Governance
        - ProposalCreatedEvent
        - ProposalConfirmedEvent
        - ProposalExecutedEvent
        - AdminAddedEvent
        - AdminRemovedEvent
        - AdminTransferredEvent
        - ThresholdChangedEvent
        # Wallet approval
        - WalletApprovedEvent
        - WalletRevokedEvent
        # Membership
        - MemberRegistered
        - CoopDeactivatedEvent
        - CoopReactivatedEvent
        # Financial
        - DonatedEvent
        - WithdrawnEvent
        - BorrowedEvent
        - RepaidEvent
        - TotalDonationsUpdatedEvent
        - TotalBorrowedUpdatedEvent
        - AvailableBalanceUpdatedEvent
        - NewDonorEvent
        # Loan lifecycle
        - LoanRequisitionCreatedCancelledEvent
        - LoanCoveredEvent
        - LoanFundedEvent
        - LoanContractGeneratedEvent
        - ParcelPaidEvent
        - LenderRepaidEvent
        - LoanCompletedEvent
        - LoanUncoveredEvent
        - BorrowerOverdueEvent
        - BorrowerDebtSettledEvent
        # Reputation
        - ReputationChangedEvent
        - AuthorizedCallerUpdatedEvent
        # Elections
        - ElectionOpenedEvent
        - CandidateAddedEvent
        - VoteCastEvent
        - ElectionClosedEvent
        - UnbeatableMajorityReachedEvent
        - NewModeratorEvent
      abis:
        - name: LoanMachine
          file: ./abis/LoanMachine.json
      eventHandlers:
        # Governance
        - event: ProposalCreated(indexed uint256,indexed uint8,indexed address)
          handler: handleProposalCreated
        - event: ProposalConfirmed(indexed uint256,indexed address,uint256)
          handler: handleProposalConfirmed
        - event: ProposalExecuted(indexed uint256,indexed uint8)
          handler: handleProposalExecuted
        - event: AdminAdded(indexed address)
          handler: handleAdminAdded
        - event: AdminRemoved(indexed address)
          handler: handleAdminRemoved
        - event: AdminTransferred(indexed address,indexed address)
          handler: handleAdminTransferred
        - event: ThresholdChanged(uint256,uint256)
          handler: handleThresholdChanged

        # Wallet approval
        - event: WalletApproved(indexed address)
          handler: handleWalletApproved
        - event: WalletRevoked(indexed address)
          handler: handleWalletRevoked

        # Membership
        - event: MemberRegistered(indexed bytes32,indexed address,address[],bool,uint256)
          handler: handleMemberRegistered
        - event: CoopDeactivated()
          handler: handleCoopDeactivated
        - event: CoopReactivated()
          handler: handleCoopReactivated

        # Financial
        - event: Donated(indexed address,uint256,uint256)
          handler: handleDonated
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
        - event: Borrowed(indexed address,uint256,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed address,uint256,uint256)
          handler: handleRepaid
        - event: TotalDonationsUpdated(uint256)
          handler: handleTotalDonationsUpdated
        - event: TotalBorrowedUpdated(uint256)
          handler: handleTotalBorrowedUpdated
        - event: AvailableBalanceUpdated(uint256)
          handler: handleAvailableBalanceUpdated
        - event: NewDonor(indexed address)
          handler: handleNewDonor

        # Loan lifecycle
        - event: LoanRequisitionCreatedCancelled(indexed uint256,indexed address,uint256,uint32,uint8)
          handler: handleLoanRequisitionCreatedCancelled
        - event: LoanCovered(indexed uint256,indexed address,uint256)
          handler: handleLoanCovered
        - event: LoanFunded(indexed uint256)
          handler: handleLoanFunded
        - event: LoanContractGenerated(indexed address,indexed uint256,uint8,uint32,uint256,uint256[],uint256)
          handler: handleLoanContractGenerated
        - event: ParcelPaid(indexed uint256,uint256)
          handler: handleParcelPaid
        - event: LenderRepaid(indexed uint256,indexed address,uint256)
          handler: handleLenderRepaid
        - event: LoanCompleted(indexed uint256)
          handler: handleLoanCompleted
        - event: LoanUncovered(indexed uint256,indexed address,uint256)
          handler: handleLoanUncovered
        - event: BorrowerOverdue(indexed uint256,indexed address,uint256)
          handler: handleBorrowerOverdue
        - event: BorrowerDebtSettled(indexed uint256,indexed address)
          handler: handleBorrowerDebtSettled

        # Reputation (inlined ReputationLib)
        - event: ReputationChanged(indexed bytes32,int32,bool,int32,uint256)
          handler: handleReputationChanged
        - event: AuthorizedCallerUpdated(indexed address,bool)
          handler: handleAuthorizedCallerUpdated

        # Elections
        - event: ElectionOpened(indexed uint32,indexed bytes32,uint256,uint256)
          handler: handleElectionOpened
        - event: CandidateAdded(indexed uint32,indexed bytes32)
          handler: handleCandidateAdded
        - event: VoteCast(indexed uint32,indexed bytes32,indexed bytes32,int32)
          handler: handleVoteCast
        - event: ElectionClosed(indexed uint32,indexed bytes32,int32)
          handler: handleElectionClosed
        - event: UnbeatableMajorityReached(indexed uint32,indexed bytes32,int32)
          handler: handleUnbeatableMajorityReached
        - event: NewModerator(indexed bytes32,uint32)
          handler: handleNewModerator