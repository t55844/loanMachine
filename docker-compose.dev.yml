  #      - cargo-registry:/usr/local/cargo/registry
  #      - cargo-git:/usr/local/cargo/git
  #  depends_on:
  #      - graph-node
  #      - hardhat-node
  #      - subgraph-deploy   
  #  restart: unless-stopped

  # --- SUBGRAPH DEPLOY ----
  subgraph-deploy:
    image: node:20
    volumes:
      - ./hardhat/scripts/graphql:/app
    working_dir: /app
    command: >
      sh -c "
        echo '=== Instalando graph-cli e dependências... ===' &&
        npm install -g @graphprotocol/graph-cli &&
        if [ -f yarn.lock ]; then yarn install; else npm install; fi &&

        echo '=== Aguardando graph-node ficar pronto (90s)... ===' &&
        sleep 90 &&

        echo '=== Removendo subgraph antigo (se existir)... ===' &&
        graph remove --node http://graph-node:8020/ loan-machine || true &&

        echo '=== Criando subgraph... ===' &&
        graph create --node http://graph-node:8020/ loan-machine &&

        echo '=== Codegen e build... ===' &&
        graph codegen &&
        graph build &&

        echo '=== Deploying subgraph no node LOCAL (versão automática v0.0.1)... ===' &&
        graph deploy --node http://graph-node:8020/ --ipfs http://ipfs:5001/ loan-machine --version-label v0.0.1 &&
        
        echo '=== SUBGRAPH DEPLOYED COM SUCESSO! ==='
      "
    depends_on:
      - graph-node
      - ipfs

volumes:
  cargo-registry:
  cargo-git: