# docker-compose.dev.yml
# Subgraph indexing stack only. Anvil runs on the host (anvil --host 0.0.0.0).

services:
  ipfs:
    image: ipfs/go-ipfs:v0.10.0
    ports:
      - '5001:5001'
      - '8080:8080'
    command: ["daemon", "--init", "--migrate=true"]
    volumes:
      - ./data/ipfs:/data/ipfs

  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: letmein
      POSTGRES_USER: graph-node
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      LC_ALL: C
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-cshared_preload_libraries=pg_stat_statements"
      - "-clisten_addresses=*"

  graph-node:
    image: graphprotocol/graph-node:latest
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: letmein
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      ethereum: 'local:http://host.docker.internal:8545'
      GRAPH_LOG: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - ipfs

  subgraph-deploy:
    image: node:20
    volumes:
      - ./hardhat/scripts/graphql:/app
    working_dir: /app
    environment:
      - COOP_REGISTRY_ADDRESS=${COOP_REGISTRY_ADDRESS}
      - START_BLOCK=${START_BLOCK:-0}
    depends_on:
      - graph-node
      - ipfs
    command: >
      sh -c "
        set -e &&
        apt-get update -qq && apt-get install -y -qq gettext-base curl &&
        npm install -g @graphprotocol/graph-cli@0.69.2 &&
        if [ -f yarn.lock ]; then yarn install; else npm install; fi &&

        echo '=== Waiting for graph-node ===' &&
        until [ \"\$$(curl -s -o /dev/null -w '%{http_code}' http://graph-node:8020/)\" != '000' ]; do sleep 2; done &&
        echo '✓ graph-node ready' &&

        echo '=== Rendering subgraph.yaml ===' &&
        envsubst '\$${COOP_REGISTRY_ADDRESS} \$${START_BLOCK}' < subgraph.template.yaml > subgraph.yaml &&

        echo '=== Removing old deploy ===' &&
        graph remove loan-machine --node http://graph-node:8020/ || true &&

        echo '=== Creating subgraph ===' &&
        graph create loan-machine --node http://graph-node:8020/ &&

        echo '=== Codegen ===' &&
        graph codegen &&

        echo '=== Build ===' &&
        graph build &&

        echo '=== Deploying ===' &&
        IPFS_URL=http://ipfs:5001 \
        GRAPH_NODE_URL=http://graph-node:8020 \
        node deploy-local.js
      "