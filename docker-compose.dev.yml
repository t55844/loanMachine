# This file is for DEVELOPMENT with HOT-RELOADING

services:
  # --- 1. BLOCKCHAIN (UNCHANGED) ---
  hardhat-node:
    build:
      context: ./hardhat
      dockerfile: Dockerfile
    ports:
      - '8545:8545'
    volumes:
      - ./hardhat/scripts:/app/scripts
      - ./hardhat/deployment-addresses.json:/app/deployment-addresses.json

# --- 2. PROXY (NEW) ---
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - RPC_URL=http://hardhat-node:8545
      - SUBGRAPH_URL=http://graph-node:8000/subgraphs/name/loan-machine
      - CONTRACT_ADDRESS=0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0  # Or dynamic from deployment
      - MOCK_USDT_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - REPUTATION_CONTRACT_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - VALUE_TO_MINT=10
    depends_on:
      - hardhat-node
      - graph-node

  # --- 3. FRONTEND (MODIFIED FOR DEV) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_URL=http://localhost:3001/api/proxy  # Client-side var for proxy
    depends_on:
      - proxy
      - graph-node

  # --- 4. GRAPHQL (UNCHANGED) ---
  ipfs:
    image: ipfs/go-ipfs:v0.10.0
    ports:
      - '5001:5001'
      - '8080:8080'
    command: ["daemon", "--init", "--migrate=true"]
    volumes:
      - ./data/ipfs:/data/ipfs

  postgres:
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: letmein
      POSTGRES_USER: graph-node
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      LC_ALL: C
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    command: 
      - "postgres"
      - "-cshared_preload_libraries=pg_stat_statements"
      - "-clisten_addresses=*"

  graph-node:
    image: graphprotocol/graph-node:latest
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: letmein
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      ethereum: 'local:http://hardhat-node:8545'
      GRAPH_LOG: info
    depends_on:
      - postgres
      - ipfs
      - hardhat-node