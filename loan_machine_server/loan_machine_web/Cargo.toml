[package]
name = "loan_machine_web"
version = "0.1.0"
edition = "2024"

[lib]
name = "loan_machine_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "loan_machine_web"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default  = ["ssr"]
ssr      = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:loan_machine_core",
    "dep:axum",
    "dep:tower-http",
    "dep:reqwest",
    "dep:hex",
    "dep:alloy",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:dotenvy",  
]
hydrate  = [
    "leptos/hydrate",
]

[dependencies]
loan_machine_core = { path = "../loan_machine_core", optional = true }
loan_machine_models = { path = "../loan_machine_models" }
serde      = { workspace = true }
serde_json = { workspace = true }
leptos        = { version = "0.8" }
leptos_meta   = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_config = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true  }
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "net", "macros"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
dotenvy = { version = "0.15", optional = true }
getrandom    = { version = "0.2", features = ["js"] }
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = [
    "Window", "CustomEvent", "CustomEventInit", "EventTarget",
] }
js-sys  = { version = "0.3" }
alloy = { workspace = true, optional = true, features = ["sol-types", "rpc-types", "network", "contract", "providers", "transport-http"] }
# SSR-only deps
axum       = { version = "0.8", optional = true, default-features = false, features = ["macros"] }
tower-http = { version = "0.5", optional = true, default-features = false, features = ["cors"] }
reqwest    = { version = "0.12", optional = true, features = ["json"] }
hex        = { version = "0.4", optional = true }
send_wrapper = "0.6"


[dev-dependencies]
leptos = { version = "0.8", features = ["ssr"] }
any_spawner = { version = "*", features = ["tokio"] }
tokio = { version = "*", features = ["rt", "macros"] }
http = "1.0"
mime = "0.3"
loan_machine_core = { path = "../loan_machine_core" }
tower         = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
hyper         = { version = "1", features = ["full"] }
alloy = { workspace = true, features = [
    "contract", "providers", "transport-http",
    "sol-types", "rpc-types", "network",
    "signer-local", "node-bindings",
] }


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[package.metadata.leptos]
output-name  = "loan_machine_web"
site-root    = "target/site"
site-pkg-dir = "pkg"
bin-features = ["ssr"]
lib-features = ["hydrate"]
assets-dir   = "public"
