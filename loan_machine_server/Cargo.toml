[workspace]
members = [
    "loan_machine_core",
    "loan_machine_web",
    "loan_machine_models",
]
resolver = "3"

[workspace.dependencies]
serde       = { version = "=1.0.209", features = ["derive"] }
serde_json  = "1.0"
thiserror   = "1.0"
tokio       = { version = "1", default-features = false }
alloy       = { version = "0.9" }
reqwest = { version = "*", features = ["json"] }
