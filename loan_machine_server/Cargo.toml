[package]
name = "loan_machine_server"
version = "0.1.0"
edition = "2021"

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:axum",
    "axum/default",    
    "axum/macros",            
    "dep:leptos_axum",              
    "dep:tokio",
    "tokio/rt",
    "tokio/net",
    "tokio/time",
    "tokio/macros",
    "dep:tower-http",
    "tower-http/cors",
    "tower-http/trace",
    "dep:alloy",          

]
hydrate = [
    "leptos/hydrate",
]

[dependencies]
# Common dependencies (used on both server and client)
leptos = { version = "0.8" }
leptos_meta = "0.8"
leptos_router = "0.8"
leptos_config = "0.8"
serde = { version = "=1.0.209", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }  
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
alloy = { version = "0.9", optional = true, features = [
    "contract",
    "providers",
    "transport-http",
    "sol-types",
    "rpc-types",
    "network",
] }
thiserror = "1.0"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }

wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = [
    "Window",
    "CustomEvent",
    "CustomEventInit",
    "EventTarget",
] }
js-sys = { version = "0.3" }


# Server-only dependencies (optional, enabled by ssr)
axum = { version = "0.8", optional = true, default-features = false }
leptos_axum = { version = "0.8", optional = true }          # NO default-features=false
tokio = { version = "1", optional = true, default-features = false, features = [
    "rt",
    "rt-multi-thread",   # ← add this
    "net",
    "time",
    "macros",
] }
tower-http = { version = "0.5", optional = true, default-features = false, features = [
    "cors",
    "trace",
    "fs",      # ← add this
] }
tower = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
http = "1.0"
mime = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "loan_machine_server"
path = "src/main.rs"
required-features = ["ssr"]

[package.metadata.leptos]
output-name = "loan_machine_server"
site-root = "target/site"
site-pkg-dir = "pkg"
bin-features = ["ssr"]
assets-dir = "public"
lib-features = ["hydrate"]     
