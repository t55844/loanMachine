[package]
name = "loan_machine_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "loan_machine_core"
path = "src/lib.rs"
crate-type = ["rlib"]



[dependencies]
loan_machine_models = { path = "../loan_machine_models" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
dotenvy     = "0.15"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex         = "0.4"
chrono      = { version = "0.4", features = ["serde"] }
reqwest     = { version = "0.12", features = ["json"] }
alloy = { workspace = true, features = [
    "contract",
    "providers",
    "transport-http",
    "sol-types",
    "rpc-types",
    "network",
] }
axum        = { version = "0.8", default-features = false, features = ["macros"] }
leptos_axum = { version = "0.8" }
leptos      = { version = "0.8", features = ["ssr"] }
leptos_config = "0.8"
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "macros",
] }
tower-http = { version = "0.5", default-features = false, features = [
    "cors", "trace", "fs",
] }
tower = { version = "0.4", default-features = false }
rand    = "0.8"

[dev-dependencies]
alloy = { workspace = true, features = [
    "contract", "providers", "transport-http",
    "sol-types", "rpc-types", "network",
    "signer-local","node-bindings",
] }
loan_machine_core = { path = ".", features = ["deployable"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum-test = "15"
tokio     = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[features]
deployable = ["alloy/signer-local"]

[[bin]]
name = "deploy_local"
path = "src/bin/deploy_local.rs"
required-features = ["deployable"]